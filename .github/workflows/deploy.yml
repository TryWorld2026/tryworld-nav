name: deploy

# 自动部署（2026-10-20 起启用）。
#
# 媒体（icons/shots/tags/news，约 336 MB）不在 git 里，R2 当前也不可用。
# 方案：把 `npm run media:backup` 生成的包作为 GitHub Release 资产保存，本
# workflow 用 actions/cache 缓存解包后的目录；cache miss 时才从 Release 下载。
# 这样仓库保持轻量，日常构建也不需要每天重新下载 336 MB，同时部署包里仍有
# 完整媒体，现有的缩略图生成与媒体守卫都照常工作。
#
# 一次性设置：
#   1. 本地 `npm run media:backup`，把生成的 assets-<日期>.tar.gz 改名为
#      assets.tar.gz
#   2. `gh release create media-v1 assets.tar.gz`（或在 GitHub 网页上传）
#   3. 仓库 Settings → Secrets and variables → Actions → Variables 新建
#      MEDIA_VERSION=media-v1
#   4. Secrets 配 CLOUDFLARE_WRANGLER_OAUTH —— 内容是本机 wrangler 的登录
#      凭据文件（见下方「为什么用 OAuth 而不是 API Token」）
#   5. 媒体变化时发 media-v2，并把 MEDIA_VERSION 改成 media-v2
#
# 凭据：优先 CLOUDFLARE_API_TOKEN（2026-10-25 更正）
#   本文件早先让 CI 直接复用本机 wrangler 的 OAuth 凭据（secret
#   CLOUDFLARE_WRANGLER_OAUTH），理由是「带 refresh_token，过期会自动续期，
#   CI 与本机可以共用同一份凭据」。**这个前提是错的。**
#
#   10-25 的实测：把 expiration_time 改到过去再跑 `wrangler whoami`，
#   refresh_token 的 md5 立刻从 124bda58 变成 f7e825fa —— OAuth 的
#   refresh_token 是**单次有效、刷新即轮换**。于是本机每刷新一次，就把 CI
#   手里那份作废；CI 报
#     Not logged in. Your auth token has expired and could not be refreshed,
#     and the environment is non-interactive.
#   这正是 deploy 从 10-21 首次运行起一路 FAILURE 的原因（10-25 才拿到日志）。
#   附带教训：旧的 `npx wrangler whoami 2>&1 | sed -n '1,12p'` 把退出码吃掉了，
#   whoami 明明没跑起来（wrangler 没装）而步骤照样 success，必须显式判退出码。
#
#   生产凭据因此改为 `CLOUDFLARE_API_TOKEN`：
#     My Profile → API Tokens → Create Token →「Edit Cloudflare Workers」模板，
#     account = d59de4a1d41cd3bfce2ce0c459cfe359。
#   API Token 不会轮换、权限可以只给 Workers，CI 与本机互不影响。
#   本机仍然用 `wrangler login` 的 OAuth 凭据跑 scripts/deploy.ps1。
#   CLOUDFLARE_WRANGLER_OAUTH 只作为兼容保留（没配 API_TOKEN 时才用），
#   且必须与本机最近一次刷新同步，否则必然过期。
#
# 为什么没有 `on: push`：
#   news-refresh 用 GITHUB_TOKEN 提交，GitHub 不会因这种提交触发新的 workflow；
#   而普通 push 直接部署又会绕过 CI 的构建检查。日常内容靠 schedule，代码发布用
#   workflow_dispatch。以后需要 push 部署，建议用 workflow_run 等 CI 成功后再触发。
#
# 首次部署仍要上传约 1.1 GB；之后媒体不变，只传变化的 HTML/JS/CSS。

on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC = 北京时间 10:30，晚于 news-refresh（01:17 UTC）与 AIHOT 日报。
    # build 自己也会抓一次 AIHOT，所以即使 news-refresh 失败，站点仍能拿到最新数据。
    - cron: '30 2 * * *'

permissions:
  contents: read

# 定时任务与手动触发撞在一起时排队，而不是取消正在进行的部署。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDIA_VERSION: ${{ vars.MEDIA_VERSION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d59de4a1d41cd3bfce2ce0c459cfe359
    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        env:
          CLOUDFLARE_WRANGLER_OAUTH: ${{ secrets.CLOUDFLARE_WRANGLER_OAUTH }}
        run: |
          missing=0
          if [ -z "$MEDIA_VERSION" ]; then
            echo "::error::MEDIA_VERSION is not set. See the header of .github/workflows/deploy.yml."
            missing=1
          fi
          # 两条凭据只要有一条在就行：API Token 优先，OAuth 是兼容退路。
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_WRANGLER_OAUTH" ]; then
            echo "::error::既没有 CLOUDFLARE_API_TOKEN 也没有 CLOUDFLARE_WRANGLER_OAUTH，wrangler 在非交互 runner 上无处登录。"
            missing=1
          fi
          if [ -n "$CLOUDFLARE_WRANGLER_OAUTH" ] && [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::正在用 OAuth 凭据退路：refresh_token 刷新即轮换，本机一登录就会把它作废。建议改用 CLOUDFLARE_API_TOKEN。"
          fi
          [ "$missing" = 0 ] || exit 1

      # 退路：只在没配 API Token 时把 OAuth 凭据放回 wrangler 认得的位置。
      # Linux runner 上 XDG_CONFIG_HOME=/home/runner/.config（实测），wrangler 读
      # $XDG_CONFIG_HOME/.wrangler/config/default.toml；这里带回退值，免得哪天
      # runner 不再导出这个变量时文件写到 / 根目录去。
      - name: Restore wrangler credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_WRANGLER_OAUTH: ${{ secrets.CLOUDFLARE_WRANGLER_OAUTH }}
        run: |
          cfg="${XDG_CONFIG_HOME:-$HOME/.config}"
          mkdir -p "$cfg/.wrangler/config"
          printf '%s' "$CLOUDFLARE_WRANGLER_OAUTH" > "$cfg/.wrangler/config/default.toml"
          chmod 600 "$cfg/.wrangler/config/default.toml"
          echo "wrote $cfg/.wrangler/config/default.toml ($(wc -c < "$cfg/.wrangler/config/default.toml") bytes)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore media cache
        id: media-cache
        uses: actions/cache@v4
        with:
          path: |
            public/assets/icons
            public/assets/shots
            public/assets/tags
            public/assets/news
          key: ${{ vars.MEDIA_VERSION }}

      - name: Download media snapshot
        if: steps.media-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/assets
          gh release download "$MEDIA_VERSION" --pattern assets.tar.gz --dir "$RUNNER_TEMP"
          # media:backup 生成的包，根目录就是 icons/shots/tags/news。
          tar -xzf "$RUNNER_TEMP/assets.tar.gz" -C public/assets

      - name: Restore thumbnail cache
        id: thumbs-cache
        uses: actions/cache@v4
        with:
          path: public/assets/thumbs
          key: thumbs-${{ vars.MEDIA_VERSION }}-${{ hashFiles('scripts/gen-thumbs.mjs') }}

      # Guard: a media-less or stale snapshot would deploy a site with missing images.
      - name: Verify media is present
        run: |
          for d in icons shots tags news; do
            if [ ! -d "public/assets/$d" ]; then
              echo "::error::public/assets/$d is absent — refusing to deploy a media-less site."
              exit 1
            fi
          done
          total=$(find public/assets/icons public/assets/shots public/assets/tags public/assets/news -type f | wc -l | tr -d ' ')
          echo "media files: $total"
          if [ "$total" -lt 4000 ]; then
            echo "::error::only $total media files; expected at least 4000. Check MEDIA_VERSION."
            exit 1
          fi

      # A stale snapshot still builds; it only renders 404 images. Fail before that.
      - name: Verify every referenced asset exists
        run: npm run media:check

      - run: npm ci

      # 装好依赖之后再验凭据：用的是 npm 锁定的 wrangler（4.151.0），不是 npx
      # 临时下载的最新版。必须显式判退出码 —— 旧写法 `npx wrangler whoami | sed`
      # 把失败吃进了管道，于是「凭据坏掉」要等 8 分钟构建完才暴露，且报错指向
      # 部署步骤而不是凭据步骤。
      - name: Verify wrangler credentials
        run: |
          set +e
          npx --no-install wrangler whoami > /tmp/whoami.log 2>&1
          code=$?
          sed -n '1,10p' /tmp/whoami.log
          if [ "$code" -ne 0 ]; then
            echo "::error::wrangler 没有可用凭据（exit $code）。配 CLOUDFLARE_API_TOKEN，或更新 CLOUDFLARE_WRANGLER_OAUTH。"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Prune
        # 与 deploy.ps1 一致：--lean 裁掉 RSC payload，保留 robots/llms/sitemap。
        run: npm run prune -- --lean

      - name: Check deploy file count
        # Cloudflare Workers Static Assets 的硬上限是 20,000 文件。
        run: |
          count=$(find out -type f | wc -l | tr -d ' ')
          echo "deploy files: $count"
          if [ "$count" -gt 19900 ]; then
            echo "::error::$count files exceeds the 19,900 safety limit (20,000 hard limit)."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
