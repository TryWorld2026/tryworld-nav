# Continuous integration.
#
# This is the quality gate, deliberately separate from `deploy.yml`. It runs on
# every pull request and every push to the default branch, and it needs no
# secrets and no network beyond `npm ci` — the product media in
# `public/assets/{icons,shots,tags,news}` is gitignored, so a fresh CI checkout
# never has it, and none of these steps require it:
#
#   assets:check  counts and hashes what is there; it only uploads on `--push`
#   news shape    checks data/news.json has the fields the cards need
#   census        reads data/*.json and reports dead cross-references
#   gen:check     re-derives data/{nav,search-index,verdict-index}.json and byte-compares
#   verdicts      schema check for the hand-written 「怎么选」 data
#   test          node --test (timezone, AIHOT mapping, search, favorites, filter URL)
#   lint          eslint . (next/core-web-vitals)
#   tsc           full type check, no emit
#   build         next build — catches prerender errors that lint/tsc miss
#
# `deploy.yml` is separate: it restores a media snapshot from a GitHub Release
# (`actions/cache` + `assets.tar.gz`) before building, so Workers Static Assets
# receives the full media manifest. CI itself still does not deploy; its build
# output is discarded.
#
# THE BUILD STEP IS A CHECK, NOT A DEPLOY SOURCE. It runs with no media and
# its `out/` is thrown away — deployment happens in deploy.yml, which restores
# `public/assets/` from the release snapshot first. That is safe precisely
# because the two are separate: this step only answers "does the code still
# build?".
#
# Verified 2026-10-16 in a media-less git worktree (exactly what CI checks out):
#   - `npm run build` exits 0 in 4.8 min with 0 media files present
#   - injecting a throw into a page component makes it exit 1 and name the
#     failing route ("Error occurred prerendering page /about")
# So it catches code and prerender regressions but NOT missing media: image
# paths are baked-in strings, and nothing checks the file exists. That gap is
# covered by the media guard in scripts/deploy.ps1 and by deploy.yml's
# pre-build check, both of which run where the media actually is.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify local media matches data/ references
        run: npm run assets:check

      - name: Verify news data shape (AIHOT feed)
        # /news 的卡片依赖 data/news.json 里的几个字段，尤其是 originalUrl
        # （跳转目标）与 source（署名，AIHOT 规则要求保留）。抓取脚本改了映射
        # 或上游改了字段名时，这里先报错，而不是等页面渲染出死链。
        run: |
          node -e "
            const n = require('./data/news.json');
            if (!Array.isArray(n) || n.length === 0) {
              console.error('::error::data/news.json 为空或不是数组');
              process.exit(1);
            }
            const required = ['id', 'title', 'summary', 'source', 'originalUrl', 'categoryLabel'];
            const missing = {};
            for (const k of required) {
              const c = n.filter(x => !x[k]).length;
              if (c) missing[k] = c;
            }
            if (Object.keys(missing).length) {
              console.error('::error::字段缺失 ' + JSON.stringify(missing));
              process.exit(1);
            }
            const dupes = n.length - new Set(n.map(x => x.id)).size;
            if (dupes) { console.error('::error::id 重复 ' + dupes + ' 条'); process.exit(1); }
            console.log('news.json OK：' + n.length + ' 条，字段齐全，id 唯一');
          "

      - name: Census (dead cross-references, coverage)
        run: npm run census

      - name: Verify generated client data is in sync
        # 2026-10-18 起，客户端需要的导航数据与搜索索引是**生成物**
        # （data/nav.json / data/search-index.json）。它们由数据源派生，
        # 如果有人改了 data/tools.json 或 categories.json 却忘了跑
        # `npm run gen:all`，页面上的分类名与搜索结果就是旧的，而 lint/tsc
        # 都不会报错。`--check` 会重算一遍并逐字节比对。
        run: npm run gen:check

      - name: Verify tool verdicts schema
        # 「怎么选」面板里的内容是人工维护的事实性主张（缺点、同类对比、起价）。
        # 这里守 schema：slug 必须存在、日期不能是未来、文本长度有上限。
        # 内容是否准确只能靠人工，但格式能自动守。
        run: npm run verdicts:check

      - name: Verify raw HTML in tool-extras can be injected safely
        # `tool-details.tsx` 的 prose 与 `tool-info-panel.tsx` 的 logo/icon 都经
        # `dangerouslySetInnerHTML` 注入，它们的安全性**是数据的属性，不是代码
        # 的属性** —— 组件注释里明说。在此之前唯一的保证是"收割时人工扫过、
        # 0 命中"，而 2026-10-19 的对抗式审查证明了这道保证会漏：
        # 449 个工具的 <svg> 里带着 `<path d="$58">`（收割截断），浏览器每次
        # 渲染报错、图标空白，435 个详情页受影响，没有任何检查拦过它。
        # 这一步把"数据干净"从注释里的断言变成每次 CI 都执行的检查。
        run: npm run extras:check

      - name: Test
        # Node 内置测试运行器，无额外依赖。覆盖两处最容易悄悄出错的地方：
        # src/lib/news.ts 的时区格式化（退回切字符串会让日期差一天，而页面上看不出来）
        # 与 scripts/fetch-aihot.mjs 的字段映射/降级（上游改字段名会静默丢署名或产生死链）。
        # 抓取测试用本地假 API，不联网。
        # 另有搜索意图词（含口语说法）、收藏存储、筛选 URL 三组纯函数用例。
        #
        # 这一条**必须在 build 之前**也没问题：它跑的是 tests/*.test.mjs 全量，
        # 其中 app-shell 与 interaction 两组在 `out/` 不存在或没有服务器时自己
        # skip —— 它们会在下面单独的步骤里、于 build 之后真的执行。
        run: npm test

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # 抓 lint/tsc 抓不到的静态渲染错误：某页在 prerender 时抛错，tsc 是过得去的
        # （类型没错），只有真正跑一次 build 才会暴露。实测注入一个 throw 后
        # 这里会 exit 1 并点名出错的路由。
        #
        # 这一步在**没有媒体**的检出上跑（CI 就是这样），产物只用于验证、不部署 ——
        # 见文件顶部的说明。跑一次约 5 分钟，比"推到线上才发现构建挂了"便宜得多。
        run: npm run build

      # ⚠️ 顺序很重要：产物断言（app-shell）与交互回归（interaction）都读 `out/`，
      # 而 2026-10-19 之前它们排在 Build **之前** —— 干净检出上 `out/` 不存在，
      # 于是 19 条产物断言 + 7 条交互断言在 CI 里 **100% skip**。其中"客户端
      # layout chunk 不得含目录数据"守的是每页 182 KB 的回归，等于从来没在 CI 跑过。
      # 现在 build 先行，这些断言才真的执行。
      - name: Product assertions (reads out/)
        run: node --test tests/app-shell.test.mjs

      - name: Interaction regression (needs a server)
        # 交互测试在没有服务器时会自动 skip（本地开发友好），但 CI 里必须真的跑：
        # 它覆盖移动端汉堡菜单、404 出口、筛选写 URL 后退、收藏链路，以及
        # 2026-10-19 修的「跨天访问 /news 水合失败」（拨时钟 +26h 复现）。
        run: |
          npx serve out -l 3100 &
          SERVER_PID=$!
          # 等端口真的能连上，最多 30 秒
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          npm run test:interaction
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
