name: auth-probe

# 一次性诊断：CLOUDFLARE_WRANGLER_OAUTH 在 runner 上到底落在哪、能不能被认到。
# 结论写进日志后即可删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: runner env
        run: |
          echo "XDG_CONFIG_HOME=[${XDG_CONFIG_HOME:-<unset>}]"
          echo "HOME=$HOME"
          ls -ld "$HOME/.config" 2>&1 | head -2

      - name: write credential to both candidate paths
        env:
          CLOUDFLARE_WRANGLER_OAUTH: ${{ secrets.CLOUDFLARE_WRANGLER_OAUTH }}
        run: |
          set -u
          echo "secret_bytes=${#CLOUDFLARE_WRANGLER_OAUTH}"
          for cfg in "${XDG_CONFIG_HOME:-}" "$HOME/.config"; do
            [ -n "$cfg" ] || continue
            mkdir -p "$cfg/.wrangler/config"
            printf '%s' "$CLOUDFLARE_WRANGLER_OAUTH" > "$cfg/.wrangler/config/default.toml"
            chmod 600 "$cfg/.wrangler/config/default.toml"
            echo "wrote $cfg/.wrangler/config/default.toml bytes=$(wc -c < "$cfg/.wrangler/config/default.toml")"
          done
          f="$HOME/.config/.wrangler/config/default.toml"
          echo "--- keys present ---"
          grep -oE '^[a-z_]+' "$f" | sort | uniq -c
          echo "--- expiration_time ---"
          grep '^expiration_time' "$f"
          echo "--- first 20 chars of oauth_token ---"
          grep '^oauth_token' "$f" | cut -c1-32

      - name: whoami with pinned wrangler
        run: |
          npm i -g wrangler@4.151.0 >/dev/null 2>&1
          set -o pipefail
          wrangler whoami 2>&1 | head -14 || echo "whoami exit=$?"
          echo "--- log dir ---"
          ls -lt "${XDG_CONFIG_HOME:-$HOME/.config}/.wrangler/logs" 2>/dev/null | head -3
